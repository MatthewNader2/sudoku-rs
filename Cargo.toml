[package]
name = "rs-sudoku"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27"
egui = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
arboard = "3.4"
rodio = { version = "0.22.2", features = ["playback"] }
dirs = "6.0.0"

[build-dependencies]
winres = "0.1.12"
